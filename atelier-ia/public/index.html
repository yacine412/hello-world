<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier — Tableau de bord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="toggle-nav" aria-label="Mes projets" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.5 16.5 9 9 16.5 1.5 9Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      Atelier
    </a>
    <span class="tagline">Tableau de bord de vos projets</span>
    <div class="topbar-right">
      <span class="freshness" id="freshness" hidden></span>
      <button class="btn" id="refresh-btn">Actualiser</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Projets">
      <div class="side-title">Mes projets</div>
      <ul class="project-list" id="project-list"></ul>
      <label class="check"><input type="checkbox" id="show-archived"> Afficher les projets archivés</label>
      <div class="new-hint">
        <strong>Nouveau projet</strong>
        Dans Claude Code, tapez <code>/nouveau-projet</code> puis décrivez votre idée.
      </div>
    </nav>
    <main class="main" id="main"></main>
  </div>

  <nav class="bottom-nav only-mobile" id="bottom-nav" aria-label="Sections" hidden>
    <button data-section="summary" class="active">Résumé</button>
    <button data-section="memory">Mémoire</button>
    <button data-section="docs">Documents</button>
    <button data-section="journal">Journal</button>
  </nav>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <div class="dialog-titles">
        <h2 id="dialog-title"></h2>
        <span class="muted small" id="dialog-meta"></span>
      </div>
      <div id="dialog-tools"></div>
      <button class="icon-btn" id="dialog-close" aria-label="Fermer">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4 4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dialog-body" id="dialog-body"></div>
    <div class="dialog-foot" id="dialog-foot"></div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
